<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        background: transparent;
        overflow: hidden;
      }

      .icon {
        width: 512px;
        height: 512px;
        border-radius: 116px;
        background: linear-gradient(145deg, #1c2029 0%, #0b0c10 62%);
        box-shadow: inset 0 0 0 10px rgba(255, 90, 60, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .dota {
        font: 600 40px/1 "Segoe UI", Arial, sans-serif;
        letter-spacing: 0.34em;
        margin-left: 0.34em;
        color: #7d8798;
        margin-bottom: 22px;
      }

      .big {
        font: 800 196px/1 "Segoe UI", Arial, sans-serif;
        letter-spacing: -6px;
        color: #ff5a3c;
        text-shadow: 0 0 70px rgba(255, 90, 60, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="dota">DOTA</div>
      <div class="big">1×6</div>
    </div>
  </body>
</html>
